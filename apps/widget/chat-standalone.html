<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챗봇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #6366f1;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --bg: #0f1117;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --error: #fb7185;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    #header {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #window-title {
      font-size: 17px;
      font-weight: 700;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #powered-by {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 88%;
      animation: fadeInMsg 0.35s ease forwards;
    }
    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 11px 16px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
      overflow-wrap: break-word;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    .msg.user .bubble {
      background: var(--accent-grad);
      color: #fff;
      border-radius: 20px 20px 4px 20px;
      white-space: pre-wrap;
    }
    .msg.assistant .bubble {
      background: rgba(255,255,255,0.07);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px 20px 20px 4px;
    }
    .msg.assistant .bubble strong { color: #fff; font-weight: 700; }
    .msg.assistant .bubble em { font-style: italic; opacity: 0.9; }
    .msg.assistant .bubble code {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      padding: 1px 5px;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px 20px 20px 4px;
      align-self: flex-start;
    }
    .dot {
      width: 6px; height: 6px;
      background: #a855f7;
      border-radius: 50%;
      animation: dotBounce 1.4s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.2) translateY(-4px); opacity: 1; }
    }

    .greeting {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 10px 0;
      opacity: 0.75;
      font-style: italic;
    }

    .error-msg {
      color: var(--error);
      font-size: 12px;
      text-align: center;
      background: rgba(251,113,133,0.1);
      padding: 7px 12px;
      border-radius: 10px;
      margin: 4px 0;
    }

    .clarification-chips {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 8px;
    }
    .clar-chip {
      font-size: 13px;
      color: var(--text);
      background: rgba(168,85,247,0.08);
      border: 1px solid rgba(168,85,247,0.35);
      border-radius: 12px;
      padding: 7px 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, border-color 0.2s;
      line-height: 1.5;
    }
    .clar-chip:hover { background: rgba(168,85,247,0.22); border-color: #a855f7; }
    .clar-chip:disabled { opacity: 0.35; cursor: not-allowed; }

    #quick-replies {
      padding: 0 16px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }
    #quick-replies.hidden { display: none; }
    .qr-chip {
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .qr-chip:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .qr-chip:disabled { opacity: 0.4; cursor: not-allowed; }

    #input-area {
      padding: 12px 16px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(255,255,255,0.01);
    }
    #msg-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      padding: 10px 16px;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    #msg-input:focus {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    #msg-input::placeholder { color: #475569; }
    #send-btn {
      width: 44px; height: 44px;
      flex-shrink: 0;
      border: none;
      border-radius: 14px;
      background: var(--accent-grad);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s, box-shadow 0.25s, opacity 0.25s;
      box-shadow: 0 3px 10px rgba(99,102,241,0.35);
    }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
    #send-btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(99,102,241,0.45); }

    #no-key-banner {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 32px;
    }
    #no-key-banner.visible { display: flex; }
    #no-key-banner svg { opacity: 0.3; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <span id="window-title">챗봇</span>
    <span id="powered-by">RAG Chatbot</span>
  </div>
  <div id="messages" aria-live="polite"></div>
  <div id="quick-replies" class="hidden"></div>
  <div id="input-area">
    <input type="text" id="msg-input" placeholder="메시지를 입력하세요..." autocomplete="off" maxlength="2000" aria-label="메시지 입력" />
    <button id="send-btn" disabled aria-label="전송">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<div id="no-key-banner">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
  </svg>
  <p>API 키가 설정되지 않았습니다.<br><code>?apiKey=YOUR_KEY</code> 파라미터를 추가해 주세요.</p>
</div>

<script>
(function () {
  "use strict";

  const params = new URLSearchParams(location.search);
  const API_KEY = params.get("apiKey") || "";
  const API_URL = location.origin + "/rag/api/v1/chat";
  const STORAGE_KEY = "rag_chat_sa_" + API_KEY;

  const messagesEl = document.getElementById("messages");
  const msgInput = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");
  const quickRepliesEl = document.getElementById("quick-replies");
  const windowTitle = document.getElementById("window-title");

  if (!API_KEY) {
    document.getElementById("no-key-banner").classList.add("visible");
    document.getElementById("input-area").style.display = "none";
    return;
  }

  // ─── State ───────────────────────────────────────────────────────────────

  let sessionId = null;
  let isStreaming = false;
  let abortController = null;
  let messageHistory = [];

  // ─── Session persistence ─────────────────────────────────────────────────

  function loadState() {
    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { sessionId: null, messages: [] };
    } catch { return { sessionId: null, messages: [] }; }
  }

  function saveState() {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ sessionId, messages: messageHistory }));
    } catch {}
  }

  // ─── Restore persisted session ────────────────────────────────────────────

  (function restoreState() {
    const saved = loadState();
    sessionId = saved.sessionId;
    messageHistory = saved.messages || [];
    messageHistory.forEach(function (item) {
      const msgEl = document.createElement("div");
      msgEl.className = "msg " + item.role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (item.role === "assistant" && item.html) {
        bubble.innerHTML = item.html;
      } else {
        bubble.textContent = item.text;
      }
      msgEl.appendChild(bubble);
      messagesEl.appendChild(msgEl);
    });
    if (messageHistory.length > 0) scrollToBottom();
  })();

  // ─── Widget config ────────────────────────────────────────────────────────

  function applyConfig(config) {
    if (!config) return;
    const accent = config.primary_color || config.primaryColor;
    if (accent) {
      document.documentElement.style.setProperty("--accent", accent);
    }
    if (config.title) windowTitle.textContent = config.title;
    if (config.placeholder) msgInput.placeholder = config.placeholder;
    if (config.greeting && messagesEl.querySelector(".greeting") === null) {
      const greet = document.createElement("p");
      greet.className = "greeting";
      greet.textContent = config.greeting;
      messagesEl.insertBefore(greet, messagesEl.firstChild);
    }
    const replies = config.quick_replies;
    if (Array.isArray(replies) && replies.length > 0) {
      quickRepliesEl.innerHTML = "";
      replies.forEach(function (text) {
        const btn = document.createElement("button");
        btn.className = "qr-chip";
        btn.textContent = text;
        btn.type = "button";
        btn.addEventListener("click", function () {
          if (isStreaming) return;
          msgInput.value = text;
          sendBtn.disabled = false;
          msgInput.focus();
        });
        quickRepliesEl.appendChild(btn);
      });
      quickRepliesEl.classList.remove("hidden");
    }
  }

  const configUrl = API_URL.replace(/\/chat$/, "/chat/widget-config");
  const browserLang = navigator.language || (navigator.languages && navigator.languages[0]) || "ko";
  fetch(configUrl, {
    headers: { "X-API-Key": API_KEY, "Accept-Language": browserLang }
  })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) { applyConfig(data); })
    .catch(function () {});

  // ─── Markdown renderer ────────────────────────────────────────────────────

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function decodeEscapedEntities(str) {
    return str
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">");
  }

  function sanitizeMarkdownUrl(rawUrl) {
    try {
      const u = new URL(decodeEscapedEntities(rawUrl));
      if (u.protocol !== "https:" && u.protocol !== "http:") return null;
      return u.href.replace(/"/g, "%22").replace(/'/g, "%27");
    } catch { return null; }
  }

  function parseMarkdown(text) {
    let out = escapeHtml(text);
    out = out.replace(/\*\*(.+?)\*\*/gs, "<strong>$1</strong>");
    out = out.replace(/__(.+?)__/gs, "<strong>$1</strong>");
    out = out.replace(/\*([^*\n]+?)\*/g, "<em>$1</em>");
    out = out.replace(/_([^_\n]+?)_/g, "<em>$1</em>");
    out = out.replace(/`([^`]+?)`/g, "<code>$1</code>");
    out = out.replace(
      /!\[([^\]]*?)\]\((https?:\/\/[^)]+?)\)/g,
      function (_, alt, rawUrl) {
        const safeUrl = sanitizeMarkdownUrl(rawUrl);
        if (!safeUrl) return "";
        return '<img src="' + safeUrl + '" alt="' + alt + '" style="max-width:100%;border-radius:8px;margin:4px 0;display:block;">';
      }
    );
    out = out.replace(
      /\[([^\]]+?)\]\((https?:\/\/[^)]+?)\)/g,
      function (_, linkText, rawUrl) {
        const safeUrl = sanitizeMarkdownUrl(rawUrl);
        if (!safeUrl) return linkText;
        return '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;opacity:0.85;">' + linkText + "</a>";
      }
    );
    out = out.replace(
      /(?<![">])(https?:\/\/[^\s<"]+)/g,
      function (_, rawUrl) {
        const safeUrl = sanitizeMarkdownUrl(rawUrl);
        if (!safeUrl) return rawUrl;
        return '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;opacity:0.85;">' + rawUrl + "</a>";
      }
    );
    out = out.replace(/\n/g, "<br>");
    return out;
  }

  // ─── UI helpers ───────────────────────────────────────────────────────────

  function appendMessage(role, text) {
    const msgEl = document.createElement("div");
    msgEl.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msgEl.appendChild(bubble);
    messagesEl.appendChild(msgEl);
    messageHistory.push({ role: role, text: text, html: null });
    saveState();
    scrollToBottom();
    return bubble;
  }

  function appendTypingIndicator() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing-indicator";
    el.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    messagesEl.appendChild(el);
    scrollToBottom();
    return el;
  }

  function appendClarification(questions) {
    const msgEl = document.createElement("div");
    msgEl.className = "msg assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = "더 정확한 답변을 위해 여쭤볼게요.";
    const chips = document.createElement("div");
    chips.className = "clarification-chips";
    questions.forEach(function (q) {
      const btn = document.createElement("button");
      btn.className = "clar-chip";
      btn.textContent = q;
      btn.type = "button";
      btn.addEventListener("click", function () {
        if (isStreaming) return;
        chips.querySelectorAll(".clar-chip").forEach(function (c) { c.disabled = true; });
        msgInput.value = q;
        sendBtn.disabled = false;
        sendMessage();
      });
      chips.appendChild(btn);
    });
    bubble.appendChild(chips);
    msgEl.appendChild(bubble);
    messagesEl.appendChild(msgEl);
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showError(text) {
    const el = document.createElement("p");
    el.className = "error-msg";
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollToBottom();
    setTimeout(function () { el.remove(); }, 5000);
  }

  function setInputEnabled(enabled) {
    msgInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
    isStreaming = !enabled;
    quickRepliesEl.querySelectorAll(".qr-chip").forEach(function (btn) {
      btn.disabled = !enabled;
    });
  }

  // ─── Chat ─────────────────────────────────────────────────────────────────

  const MAX_MSG_LEN = 2000;
  let lastSentAt = 0;

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || isStreaming) return;
    if (text.length > MAX_MSG_LEN) {
      showError("메시지는 " + MAX_MSG_LEN + "자 이하로 입력해 주세요.");
      return;
    }
    const now = Date.now();
    if (now - lastSentAt < 500) return;
    lastSentAt = now;

    msgInput.value = "";
    setInputEnabled(false);
    appendMessage("user", text);

    const typing = appendTypingIndicator();
    let assistantBubble = null;

    abortController = new AbortController();
    let assistantText = "";

    try {
      const lang = navigator.language || (navigator.languages && navigator.languages[0]) || "ko";
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY,
          "Accept-Language": lang,
        },
        body: JSON.stringify({ message: text, session_id: sessionId }),
        signal: abortController.signal,
      });

      if (!res.ok) throw new Error("HTTP " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let event;
          try { event = JSON.parse(raw); } catch { continue; }

          if (event.type === "session") {
            const sid = event.session_id;
            if (typeof sid === "string" && /^[a-zA-Z0-9_-]{8,128}$/.test(sid)) {
              sessionId = sid;
              saveState();
            }
          } else if (event.type === "clarification") {
            typing.remove();
            appendClarification(event.questions || []);
          } else if (event.type === "token") {
            if (!assistantBubble) {
              typing.remove();
              const msgEl = document.createElement("div");
              msgEl.className = "msg assistant";
              assistantBubble = document.createElement("div");
              assistantBubble.className = "bubble";
              msgEl.appendChild(assistantBubble);
              messagesEl.appendChild(msgEl);
            }
            assistantText += event.content;
            assistantBubble.innerHTML = parseMarkdown(assistantText);
            scrollToBottom();
          } else if (event.type === "output_blocked") {
            if (!assistantBubble) {
              typing.remove();
              const msgEl = document.createElement("div");
              msgEl.className = "msg assistant";
              assistantBubble = document.createElement("div");
              assistantBubble.className = "bubble";
              msgEl.appendChild(assistantBubble);
              messagesEl.appendChild(msgEl);
            }
            assistantText = event.content || "";
            assistantBubble.innerHTML = parseMarkdown(assistantText);
            scrollToBottom();
          }
        }
      }

      if (assistantText) {
        messageHistory.push({ role: "assistant", text: assistantText, html: parseMarkdown(assistantText) });
        saveState();
      }
    } catch (err) {
      if (err.name !== "AbortError") {
        typing.remove();
        showError("메시지 전송에 실패했습니다. 다시 시도해 주세요.");
      }
    } finally {
      const remainingTyping = document.getElementById("typing-indicator");
      if (remainingTyping) remainingTyping.remove();
      setInputEnabled(true);
      msgInput.focus();
      abortController = null;
    }
  }

  // ─── Event listeners ─────────────────────────────────────────────────────

  msgInput.addEventListener("input", function () {
    sendBtn.disabled = msgInput.value.trim() === "" || isStreaming;
  });

  msgInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  msgInput.focus();
})();
</script>
</body>
</html>
